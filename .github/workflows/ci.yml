name: CI

on:
  pull_request:
    branches:
      - dev
      - production
  push:
    branches:
      - dev
      - production

permissions:
  contents: read

jobs:
  release-source:
    name: Release source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require production releases from this repository's dev branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_BRANCH" == "production" && ( "$HEAD_BRANCH" != "dev" || "$HEAD_REPOSITORY" != "$REPOSITORY" ) ]]; then
            echo "::error::Production releases must come from this repository's dev branch. Target dev for other changes."
            exit 1
          fi

  lint-and-test:
    name: Format, lint, typecheck, dead code, dupes, unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Check dead code
        run: bun run dead-code

      - name: Check duplicates
        run: bun run dupes

      - name: Test
        run: bun run test

  build:
    name: Build
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_FREE_TOUR_URL: ${{ vars.VITE_FREE_TOUR_URL }}
        run: bun run build

  e2e:
    name: E2E Tests
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Hold this lock through provisioning, deployment and tests. A running job
    # must finish before another attempt can replace its backend.
    concurrency:
      group: convex-e2e-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Create empty Convex preview and deploy
        id: preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_E2E_PREVIEW_DEPLOY_KEY }}
          CONVEX_PREVIEW_NAME: e2e-pr-${{ github.event.pull_request.number }}
          E2E_GOOGLE_CALENDAR_ID: ${{ vars.E2E_GOOGLE_CALENDAR_ID }}
          E2E_GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.E2E_GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          E2E_PREVIEW_INTEGRATIONS_CONFIRMED: ${{ vars.E2E_PREVIEW_INTEGRATIONS_CONFIRMED }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.E2E_VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          bun -e 'import { validatePreviewKey } from "./scripts/convex-preview-safety.ts"; validatePreviewKey(process.env.CONVEX_DEPLOY_KEY)'
          bunx convex deploy --preview-create "$CONVEX_PREVIEW_NAME" --typecheck enable \
            --cmd "bun scripts/prepare-convex-preview.ts" --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Type-check regenerated Convex API and frontend
        run: bun run typecheck

      - name: Record preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_NAME: e2e-pr-${{ github.event.pull_request.number }}
        run: |
          printf 'Convex smoke-test preview: `%s` at %s. Empty DB for this attempt; automatic Convex expiration.\n' \
            "$PREVIEW_NAME" "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Run E2E
        env:
          VITE_CONVEX_URL: ${{ steps.preview.outputs.url }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.E2E_VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_FREE_TOUR_URL: ${{ vars.VITE_FREE_TOUR_URL }}
          E2E_RESEND_API_KEY: ${{ secrets.E2E_RESEND_API_KEY }}
          E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy production
    needs: [lint-and-test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex and build frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_FREE_TOUR_URL: ${{ vars.VITE_FREE_TOUR_URL }}
        run: bunx convex deploy --cmd "bun run build" --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Deploy prebuilt output to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
