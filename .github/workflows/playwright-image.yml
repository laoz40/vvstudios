name: Playwright image benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, production]
    paths:
      - .github/workflows/playwright-image.yml

permissions:
  contents: read

jobs:
  playwright-container:
    name: Playwright container startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Pull version-matched image and launch Chromium
        run: |
          playwright_version=$(bun -p 'require("@playwright/test/package.json").version')
          image="mcr.microsoft.com/playwright:v${playwright_version}-noble"
          time docker pull "$image"
          time docker run --rm --ipc=host --volume "$PWD:/work:ro" --workdir /work "$image" \
            node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); console.log(browser.version()); await browser.close();'
